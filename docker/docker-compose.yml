services:
  svdsim_devel_base:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: svdsim_service_image_devel
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_AUTOMATIC_DISCOVERY_RANGE=${ROS_AUTOMATIC_DISCOVERY_RANGE:-error}
      - XAUTHORITY=/tmp/.docker.xauth
    stdin_open: true
    tty: true
    user: ${USERID:-1000}:${GROUPID:-1000}
    volumes:
      - ..:/home/developer/ws/src/project
      - /tmp:/tmp:rw
      - svdsim_persistence:/home/developer/ws/persistence
    ports:
      - "8765:8765"

  svdsim_devel:
    extends:
      service: svdsim_devel_base

volumes:
  svdsim_persistence:
