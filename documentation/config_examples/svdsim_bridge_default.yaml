# Reference configuration for the `svdsim_bridge` node.
#
# Every parameter below is set to the value that the node declares in
# svd_simulator/svdsim_bridge/src/svdsim_bridge_node.cpp. The node declares all
# six parameters, so omitting a key has the same effect as setting it to the
# value shown here.
#
# `port` must match the port assigned to the vehicle in the server grid file.
#
# Launch with:
#   ros2 run svdsim_bridge svdsim_bridge_node --ros-args \
#     --params-file documentation/svd_simulator/config_examples/svdsim_bridge_default.yaml

svdsim_bridge:
  ros__parameters:
    hostname: "localhost"
    port: 4242
    lidar_frame_id: "laser"
    imu_frame_id: "imu"
    map_frame_id: "map"
    base_link_frame_id: "base_link"
